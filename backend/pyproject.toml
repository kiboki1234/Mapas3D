[project]
name = "city3d-engine-backend"
version = "0.1.0"
description = "Backend geoespacial modular para City3D Engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "numpy>=2.1,<3",
  "pillow>=11,<13",
  "pydantic-settings>=2.7,<3",
  "pyproj>=3.7,<4",
  "shapely>=2.1,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
overture = ["overturemaps>=0.19,<1"]
test = ["pytest>=8.3,<9", "pytest-cov>=6,<7", "respx>=0.22,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

